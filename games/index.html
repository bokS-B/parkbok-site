/* parkbok site.css — 토큰 · 셸(헤더/푸터) · 공통 컴포넌트. tools/build-site.js 가 모든 페이지 <head> 에 인라인한다. */
:root{

  --accent:#2563eb;--accent-ink:#fff;--accent-hover:#1d4ed8;--accent-active:#1e3a8a;--accent-tint:#eef3ff;--accent-text:#2563eb;--accent-label:#1d4ed8;--hub:#fff;

  --cat-hwp:#2563eb;--cat-text:#10b981;--cat-wheel:#8b5cf6;--cat-game:var(--cat-wheel);--cat-guide:#64748b;--cat-pdf:#ef4444;--cat-image:#f59e0b;--cat-color:#ec4899;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --fs-body:16px;--lh-body:24px;--fs-h1:32px;--lh-h1:40px;--fs-lead:18px;--lh-lead:28px;--fs-h1-compact:20px;--lh-h1-compact:28px;

  --drop-compact-h:48px;--drop-home-max-h:140px;--chip-h:34px;--chip-pad:4px 16px;--chip-fs:15px;--badge-h:24px;--badge-pad:4px 8px;

}
html[lang="en"],html[lang="es"],html[lang="pt"],html[lang="de"],html[lang="fr"]{--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}

/* 다크: 기기 설정을 따르되, 헤더의 ◐ 버튼으로 고른 값(data-theme)이 있으면 그것을 우선 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--ink:#e5e7eb;--muted:#94a3b8;--line:#334155;--accent-tint:#1e3a8a;--accent-text:#93c5fd;--accent-label:#bfdbfe;--hub:#0f172a;--err:#f87171;--ok:#4ade80;--footer-bg:#0f172a;--badge-new:#1e3a5f;--info-bg:#1e3a5f;--info-border:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--ink:#e5e7eb;--muted:#94a3b8;--line:#334155;--accent-tint:#1e3a8a;--accent-text:#93c5fd;--accent-label:#bfdbfe;--hub:#0f172a;--err:#f87171;--ok:#4ade80;--footer-bg:#0f172a;--badge-new:#1e3a5f;--info-bg:#1e3a5f;--info-border:#60a5fa}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}

/* ---------- 기본 ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;display:flex;flex-direction:column;min-height:100vh}
body>main{flex:1 0 auto;width:100%;min-width:0}
footer.foot{margin-top:auto}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
img,svg{vertical-align:middle}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--header-pad-x)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{padding:24px 0 40px;min-height:50vh}
main.wrap{padding-block:24px 40px}
h1{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-semibold);margin:0 0 8px}
h2{font-size:20px;line-height:28px;font-weight:var(--fw-semibold);margin:28px 0 8px}
h3{font-size:16px;line-height:24px;font-weight:var(--fw-semibold);margin:0 0 6px}
p{margin:0 0 14px}
p.lead,.lead{font-size:var(--fs-lead);line-height:var(--lh-lead);color:var(--muted);margin:0 0 24px}
.tool-head{margin:0 0 24px}.tool-head h1{margin:0 0 8px}.tool-head .lead{margin:0}
.muted{color:var(--muted);font-size:var(--fs-small)}
code{font-size:.92em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-btn);padding:12px;overflow:auto;font-size:13px}

/* ---------- 셸: 헤더 ---------- */
header.top{position:sticky;top:0;z-index:var(--header-z);background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:var(--header-h)}
.brand{font-weight:var(--fw-bold);font-size:20px;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.brand:hover{text-decoration:none;color:var(--brand)}
nav.menu{position:relative;display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{position:relative;display:inline-block;font-size:var(--fs-small);font-weight:var(--fw-medium);line-height:18px;padding:8px 12px;border-radius:var(--r-pill);color:var(--muted);transition:var(--t-chip)}
nav.menu a::before{content:"";position:absolute;left:0;right:0;top:calc(50% - var(--touch)/2);height:var(--touch)}
nav.menu a:hover{background:var(--bg);color:var(--ink);text-decoration:none}
nav.menu a.on{background:var(--accent);color:var(--accent-ink)}
.lang-select{flex:none;margin-left:auto;min-height:var(--touch);font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card);color:var(--ink);max-width:130px}
.theme-btn{position:relative;flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;padding:0}
/* 가상 영역은 패딩 박스 기준이라 테두리 1px 을 더해 -6px 이어야 실제 클릭 폭 44px */
.theme-btn::before{content:"";position:absolute;inset:-6px}
.theme-btn:hover{border-color:var(--ink)}
.chips.filters{margin:24px 0 12px}
.subnav{border-top:1px solid var(--line)}
header.top .subnav .wrap{display:flex;align-items:center;gap:6px;height:var(--subnav-h);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav .chip{height:28px;padding:2px 12px;font-size:13px}
.subnav .chip::before{top:calc(50% - var(--subnav-h)/2);height:var(--subnav-h)}
.subnav .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---------- 셸: 브랜드 마크 — brand:start~end 는 build-color-pages.js 가 그대로 hex.css 뒤에 붙인다(롱테일 페이지도 같은 마크 규칙) ---------- */
/* brand:start */
:root{--brand:#511919}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#e2a096}}
:root[data-theme="dark"]{--brand:#e2a096}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand svg{flex:none;width:37px;height:26px;color:var(--brand)}
@media (max-width:860px){.brand svg{width:34px;height:24px}}
@media (max-width:767.98px){.brand{gap:6px}.brand svg{width:31px;height:22px}}
@media (max-width:480px){.brand{gap:0}.brand-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
/* brand:end */

/* ---------- 셸: 푸터 ---------- */
footer.foot{background:var(--footer-bg);color:var(--footer-ink);border-top:1px solid var(--line);padding:32px 0 24px;margin-top:40px}
.foot-links{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:var(--fs-small);line-height:var(--lh-small)}
.foot a{color:var(--footer-ink);opacity:.85}.foot a:hover{opacity:1;text-decoration:underline}
.foot-copy{font-size:var(--fs-caption);line-height:var(--lh-caption);opacity:.7;margin:14px 0 0}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--touch);font:inherit;font-size:var(--btn-fs);line-height:var(--btn-lh);font-weight:var(--btn-fw);padding:var(--btn-pad);border:0;border-radius:var(--r-btn);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;transition:var(--t-btn);margin:0;white-space:nowrap}
.btn:hover{background:var(--accent-hover);color:var(--accent-ink);text-decoration:none}
.btn:active{background:var(--accent-active)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--accent-text);outline:2px solid var(--accent-text);outline-offset:-2px}
.btn.ghost:hover{background:var(--accent-tint);color:var(--accent-text);outline-color:var(--accent-text)}
.btn.ghost:active{color:var(--ink);outline-color:var(--ink)}
.btn.sm{position:relative;min-width:44px;min-height:0;font-size:var(--btn-sm-fs);line-height:16px;padding:var(--btn-sm-pad)}
.btn.sm::before{content:"";position:absolute;inset:-6px 0}
.btn-big{display:inline-flex;align-items:center;justify-content:center;min-height:var(--btn-big-min-h);min-width:var(--btn-big-min-w);padding:var(--btn-big-pad);font:inherit;font-size:var(--btn-big-fs);line-height:var(--btn-big-lh);font-weight:var(--fw-medium);border:0;border-radius:var(--r-big);background:var(--accent);color:var(--accent-ink);box-shadow:var(--sh-btn-big);cursor:pointer;transition:var(--t-btn)}
.btn-big:hover{background:var(--accent-hover)}.btn-big:active{background:var(--accent-active)}.btn-big:disabled{opacity:.5;pointer-events:none}
.tools,.row,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

/* ---------- 입력 / 상태 ---------- */
.drop{border:2px dashed var(--muted);border-radius:var(--r-card);padding:40px 24px;text-align:center;background:var(--card);cursor:pointer;transition:var(--t-btn)}
.drop.on{border-color:var(--accent);background:var(--accent-tint)}
.drop.err{border-color:var(--err)}
.drop strong{display:block;font-size:17px;margin-bottom:6px}
.drop span,.droptxt{color:var(--muted);font-size:var(--fs-small)}
.status{font-size:var(--fs-small);color:var(--muted);margin:8px 0}
.status:empty{display:none}
.status.err{color:var(--err)}.status.ok{color:var(--ok)}.status.busy,.status.empty{color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:var(--fs-small);margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-big);padding:10px 14px}
.opts label{display:inline-flex;align-items:center;gap:5px;min-height:var(--touch);white-space:nowrap}
.opts select,.opts input[type=text],.opts input[type=number]{min-height:var(--touch);font:inherit;font-size:var(--fs-small);padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card);color:var(--ink)}
.opts .sep{flex-basis:100%;height:0}
.tt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tt-grid textarea,#textout{width:100%;min-height:260px;font:inherit;font-size:15px;line-height:1.6;border:1px solid var(--line);border-radius:var(--r-btn);padding:12px;resize:vertical;background:var(--card);color:var(--ink)}
.tt-grid textarea[readonly],#textout{background:var(--bg)}
.tt-grid textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tt-grid .lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
#textout{min-height:200px;max-height:60vh;white-space:pre-wrap}
#viewer{min-height:200px;background:var(--line);border-radius:var(--r-btn);overflow:auto;max-height:80vh;color:#1d2129}
#viewer:empty{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:var(--fs-caption);color:var(--muted)}
.stat.over b{color:var(--err)}
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r-big);padding:16px}

/* ---------- 카드 / 그리드 / 칩 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--grid-gap);position:relative}
.grid.tools-grid{grid-template-columns:repeat(var(--grid-cols,5),1fr)}
@media (max-width:1280px){.grid.tools-grid{--grid-cols:4}}
@media (max-width:960px){.grid.tools-grid{--grid-cols:3}}
@media (max-width:640px){.grid.tools-grid{--grid-cols:2}}
@media (max-width:440px){.grid.tools-grid{--grid-cols:1}}
.card{display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--card-pad);margin:16px 0;color:var(--ink);box-shadow:var(--sh-card);overflow:hidden}
.grid .card{margin:0;transition:var(--t-card)}
a.card{text-decoration:none}
a.card:hover{border-color:var(--ink);text-decoration:none}
.grid .card h3,a.card h3{font-size:var(--fs-card-title);line-height:var(--lh-card-title);font-weight:var(--fw-semibold);margin:0 0 8px;color:var(--ink)}
.grid .card p,a.card p{font-size:var(--fs-card-desc);line-height:var(--lh-card-desc);letter-spacing:var(--ls-card-desc);color:var(--muted);margin:0}
.card-icon{display:block;width:var(--card-icon);height:var(--card-icon);margin-bottom:var(--card-icon-mb)}
.card-icon svg{width:100%;height:100%}
.card.hidden{transform:scale(0);opacity:0;position:absolute;pointer-events:none}
.badge{position:absolute;top:12px;right:12px;height:var(--badge-h);padding:var(--badge-pad);font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:var(--fw-medium);border-radius:var(--r-badge);background:var(--badge-new);border:1px solid var(--badge-new);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.chip,.chips a,.chips button,.preset{position:relative;display:inline-flex;align-items:center;height:var(--chip-h);padding:var(--chip-pad);font:inherit;font-size:var(--chip-fs);font-weight:var(--fw-medium);line-height:1;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:var(--t-chip);white-space:nowrap}
/* 보이는 높이는 작아도 터치 영역은 44px */
.chip::before,.chips a::before,.chips button::before,.preset::before{content:"";position:absolute;left:0;right:0;top:calc(50% - var(--touch)/2);height:var(--touch)}
.chip:hover,.chips a:hover,.chips button:hover,.preset:hover{border-color:var(--ink);color:var(--ink);text-decoration:none}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.preset.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button,.preset{height:28px;padding:2px 12px;font-size:13px}
.opts .chips{margin:0;flex-wrap:wrap;overflow:visible}
.next-title{font-size:var(--fs-small);color:var(--muted);margin-right:4px}

/* ---------- 설명·FAQ·광고 ---------- */
details.about{margin-top:16px;color:var(--muted);font-size:var(--fs-small)}
details.about summary{cursor:pointer;font-weight:var(--fw-semibold);list-style:none;padding:12px 0}
details.about summary::-webkit-details-marker{display:none}
details.about summary::before{content:"▸ "}
details.about[open] summary::before{content:"▾ "}
details.about summary:hover{color:var(--ink)}
details.about p,details.about ol,details.about ul{margin:8px 0}
details.about ol,details.about ul{padding-left:20px}
.faq dt{font-weight:var(--fw-semibold);margin-top:14px;color:var(--ink)}
.faq dd{margin:4px 0 0;color:var(--muted)}
article p{margin:0 0 14px}article ul,article ol{padding-left:22px}article li{margin:4px 0}
.ad{margin:16px auto;max-width:var(--ad-max-w)}
.ad:empty{display:none}

/* ---------- 반응형 ---------- */
@media (max-width:860px){
  .wrap{padding-inline:var(--gutter)}
  header.top .wrap{gap:8px}
  .brand{font-size:18px}
  nav.menu a{padding:8px 10px;font-size:13px}
}
@media (max-width:767.98px){
  main.wrap{padding-block:20px 28px}
  h1{font-size:24px;line-height:32px}
  p.lead,.lead{font-size:16px;line-height:24px}
  .drop{padding:24px 16px}
  .btn-big{min-height:60px;font-size:20px;line-height:24px;padding:16px 28px}
