<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PARKBOK 홈 시안 비교</title>
<style>
:root{--bg:#eef1f5;--ink:#202735;--panel:#fff;--line:#cbd3df;--accent:#2563eb;--font:system-ui,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 16px 0 0}select,a{font:inherit;border:1px solid var(--line);border-radius:6px;min-height:40px;padding:8px;background:var(--panel);color:var(--ink)}a{text-decoration:none}a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}p{margin:8px 0 0;color:var(--ink)}.stage{height:calc(100dvh - 122px);overflow:auto;padding:16px}iframe{display:block;margin:auto;border:1px solid var(--line);background:var(--panel);height:900px;width:1280px;max-width:none}label{display:flex;align-items:center;gap:4px}
</style></head><body><header><div class="controls"><h1>PARKBOK 홈 시안 비교</h1><label>시안<select id="concept"><option value="a">A. 필요한 도구, 여기 한곳에 (추천)</option><option value="b">B. 찾아다니던 도구를 한곳에</option><option value="before">현재 배포본</option></select></label><label>화면<select id="width"><option value="1280">데스크톱 1280 × 900</option><option value="375">모바일 375 × 812</option></select></label><label>테마<select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select></label><a id="open" href="/" target="_blank">시안 직접 열기</a></div><p id="note">A안: 제목 40px / 모바일 26px. 작은 선 아이콘과 가로 배치로 도구 목록을 먼저 읽게 했습니다.</p></header><main class="stage"><iframe id="frame" title="선택한 PARKBOK 홈 시안" src="/"></iframe></main>
<script>
const concept=document.querySelector('#concept'),width=document.querySelector('#width'),theme=document.querySelector('#theme'),frame=document.querySelector('#frame'),note=document.querySelector('#note');
const paths={a:'/',b:'/_hallmark/b/',before:'/_hallmark/before/'};
function setTheme(){frame.contentDocument.documentElement.dataset.theme=theme.value;}
function update(){frame.style.width=width.value+'px';frame.style.height=(width.value==='375'?812:900)+'px';const dest=paths[concept.value];if(frame.getAttribute('src')!==dest)frame.src=dest;else setTheme();document.querySelector('#open').href=dest;note.textContent=concept.value==='a'?'A안: 제목 40px / 모바일 26px. 작은 선 아이콘과 가로 배치로 도구 목록을 먼저 읽게 했습니다.':concept.value==='b'?'B안: 제목 48px / 모바일 28px. 도구를 모았다는 메시지를 더 크게 강조합니다.':'현재 배포본: 기존 제목과 카드 크기, 색상 아이콘을 비교하세요.';}
frame.addEventListener('load',setTheme);for(const el of [concept,width,theme])el.addEventListener('change',update);
</script></body></html>
