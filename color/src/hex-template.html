<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="{{hex}}">
<script>try{var __t=localStorage.getItem('pb_theme');if(__t)document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
{{adsense}}
{{ga}}
<link rel="stylesheet" href="/color/hex/hex.css">
</head>
<body>
{{shell_header}}
<main class="wrap">
<h1>{{h1}}</h1><p class="lead">{{line}}</p>
<div class="sw" style="background:{{hex}};color:{{ink}}">{{HEX}}</div>
{{rows}}
<div class="ct">{{contrast}}</div>
<h2>Shades<span>light → dark</span></h2>
<div class="sc">{{scale}}</div>
<h2>Harmonies<span>complement · analogous ×2 · triadic ×2</span></h2>
<div class="chips">{{harmony}}</div>
<h2>CSS</h2>
<div class="v"><pre>{{csscode}}</pre><button>Copy</button></div>
<p class="actions"><a class="btn" href="/color/converter/#{{hex6}}">Edit color</a></p>
<div class="ad"></div>
<h2>More colors</h2>
<nav class="sc n5" aria-label="More colors">{{random}}</nav>
</main>
{{shell_footer}}
<script>document.onclick=function(e){var b=e.target;if(b.tagName!='BUTTON'||b.parentNode.className!='v')return;navigator.clipboard&&navigator.clipboard.writeText(b.previousSibling.textContent);b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},900)}</script>
</body>
</html>
