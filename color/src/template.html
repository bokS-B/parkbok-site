<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{hreflangs}}
<meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
{{shell_head}}
<style id="page-css">{{css}}</style>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="page-color">
{{shell_header}}
<!-- tool:start -->
<main class="wrap">
  <div class="tool-head"><h1>{{h1}}</h1><p class="lead">{{line}}</p></div>
  <section class="tool" id="app"></section>
  <div class="ad"></div>
  <nav class="chips next" aria-label="{{nextTools}}">{{nextChips}}</nav>
{{about}}
</main>
{{shell_footer}}
<script>window.COLOR_STRINGS={{strings}};window.COLOR_TOOL={{tool}};</script>
<script src="/color/color.js" defer></script>
<script src="/color/color-ui.js" defer></script>
{{toolAssets}}<script src="/color/tools/{{toolId}}.js" defer></script>
<!-- tool:end -->
<!-- hub:start -->
<main class="wrap">
  <div class="tool-head"><h1>{{h1}}</h1><p class="lead">{{line}}</p></div>
  <div class="grid tools-grid">{{cards}}</div>
  <div class="ad"></div>
  <details class="about">
    <summary>{{aboutTitle}}</summary>
    <p>{{aboutLine}}</p>
  </details>
</main>
{{shell_footer}}
<script>window.COLOR_STRINGS={{strings}};window.COLOR_TOOL={{tool}};</script>
<script src="/color/color.js" defer></script>
<script src="/color/color-ui.js" defer></script>
<!-- hub:end -->
</body>
</html>
