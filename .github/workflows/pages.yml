name: Build and deploy public site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Generate all public pages and check shared shell
        run: node tools/build-all.js
      - name: Test tool logic and packaging
        run: |
          node --test tests/*.test.js tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package and validate public files
        run: python3 tools/package-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
