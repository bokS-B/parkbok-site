<!-- 사이트 셸: 모든 페이지가 공유하는 <head> 공통부·헤더·푸터. tools/shell.js 가 읽어 채우고, build-site.js / build-wheel.js 가 각 페이지의 같은 이름 마커 사이에 끼워 넣는다. -->
<!-- shell:head-common -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<script>try{var __t=localStorage.getItem('pb_theme');if(__t)document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="parkbok">
<meta property="og:image" content="https://parkbok.com/{{og}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{adsense}}
{{ga}}
<style id="site-css">
{{site_css}}
</style>
<!-- /shell:head-common -->
<!-- shell:header -->
<header class="top"><div class="wrap"><a class="brand" href="/">{{brand}}</a><nav class="menu" aria-label="{{menu}}"><a href="/"{{on:hwp}}>{{nav.hwp}}</a><a href="/text/"{{on:text}}>{{nav.text}}</a><a href="{{pdf_home}}"{{on:pdf}}>{{nav.pdf}}</a><a href="{{image_home}}"{{on:image}}>{{nav.image}}</a><a href="{{color_home}}"{{on:color}}>{{nav.color}}</a><a href="{{wheel_home}}"{{on:wheel}}>{{nav.wheel}}</a><a href="/guide/"{{on:guide}}>{{nav.guide}}</a>{{lang_select}}</nav><button type="button" class="theme-btn" id="theme-btn" aria-label="{{theme}}" title="{{theme}}">◐</button></div>{{subnav}}<script>document.getElementById('theme-btn').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme'),d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches,n=c?(c==='dark'?'light':'dark'):(d?'light':'dark');r.setAttribute('data-theme',n);try{localStorage.setItem('pb_theme',n)}catch(e){}window.dispatchEvent(new Event('resize'))});
// 모바일 메뉴: 현재 분류를 보이는 자리로 스크롤하고, 끝까지 스크롤되면 오른쪽 페이드를 끈다
(function(){var n=document.querySelector('nav.menu');if(!n)return;var f=function(){n.classList.toggle('end',n.scrollLeft+n.clientWidth>=n.scrollWidth-1)};n.addEventListener('scroll',f,{passive:true});window.addEventListener('resize',f);var o=n.querySelector('a.on');if(o&&n.scrollWidth>n.clientWidth)n.scrollLeft=Math.max(0,o.offsetLeft-(n.clientWidth-o.offsetWidth)/2);f()})();</script></header>
<!-- /shell:header -->
<!-- shell:footer -->
<footer class="foot"><div class="wrap"><nav class="foot-links" aria-label="{{footMenu}}"><a href="/about.html">{{foot.about}}</a><a href="/privacy.html">{{foot.privacy}}</a><a href="/terms.html">{{foot.terms}}</a><a href="/guide/">{{foot.guide}}</a></nav><p class="foot-copy">© parkbok{{foot_extra}}</p></div></footer>
<!-- /shell:footer -->
