<!-- 사이트 셸: 모든 페이지가 공유하는 <head> 공통부·헤더·푸터. tools/shell.js 가 읽어 채우고, build-site.js / build-wheel.js 가 각 페이지의 같은 이름 마커 사이에 끼워 넣는다. -->
<!-- shell:head-common -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<meta property="og:type" content="website">
<meta property="og:site_name" content="parkbok">
<meta property="og:image" content="https://parkbok.com/{{og}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{adsense}}
{{ga}}
<style id="site-css">
{{site_css}}
</style>
<!-- /shell:head-common -->
<!-- shell:header -->
<header class="top"><div class="wrap"><a class="brand" href="/">{{brand}}</a><nav class="menu" aria-label="{{menu}}"><a href="/"{{on:hwp}}>{{nav.hwp}}</a><a href="/text/"{{on:text}}>{{nav.text}}</a><a href="{{wheel_home}}"{{on:wheel}}>{{nav.wheel}}</a><a href="/guide/"{{on:guide}}>{{nav.guide}}</a></nav>{{lang_select}}</div>{{subnav}}</header>
<!-- /shell:header -->
<!-- shell:footer -->
<footer class="foot"><div class="wrap"><nav class="foot-links"><a href="/about.html">{{foot.about}}</a><a href="/privacy.html">{{foot.privacy}}</a><a href="/terms.html">{{foot.terms}}</a><a href="/guide/">{{foot.guide}}</a></nav><p class="foot-copy">© parkbok{{foot_extra}}</p></div></footer>
<!-- /shell:footer -->
